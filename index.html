<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Cats Save Editor</title>
  <style>
    body {
      font-family: sans-serif;
      background: #171923;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #7dd3fc; }
    .box {
      background: #292d3e;
      padding: 20px;
      margin: 20px 0;
      border-radius: 15px;
    }
    button {
      background: #38bdf8;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      margin: 10px;
      font-size: 16px;
    }
    textarea {
      width: 95%;
      height: 150px;
      background: #111827;
      color: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>🐱 Battle Cats Save Editor</h1>
  <p>모바일 세이브 파일 도구</p>

  <div class="box">
    <h3>세이브 파일 선택</h3>
    <input type="file" id="saveFile">
    <p id="status">파일을 선택하세요.</p>
  </div>

  <div class="box">
    <h3>파일 내용</h3>
    <textarea id="content" placeholder="파일 내용"></textarea>
    <br>
    <button onclick="downloadFile()">파일 저장</button>
  </div>

  <script>
    let fileName = "save.txt";

    document.getElementById("saveFile").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      fileName = file.name;
      const reader = new FileReader();

      reader.onload = function() {
        document.getElementById("content").value = reader.result;
        document.getElementById("status").textContent =
          "선택한 파일: " + file.name;
      };

      reader.onerror = function() {
        document.getElementById("status").textContent =
          "파일을 읽을 수 없습니다.";
      };

      reader.readAsText(file);
    });

    function downloadFile() {
      const blob = new Blob(
        [document.getElementById("content").value],
        {type: "text/plain;charset=utf-8"}
      );

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.click();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
  </html>
