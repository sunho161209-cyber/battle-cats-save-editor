<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Cats Save Editor</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#171923;
  color:white;
  text-align:center;
  padding:20px;
}

.box {
  background:#292d3e;
  padding:20px;
  border-radius:15px;
  margin:20px auto;
  max-width:400px;
}

input, button {
  padding:12px;
  margin:10px;
  border-radius:8px;
  font-size:16px;
}

button {
  background:#38bdf8;
  border:0;
}
</style>

</head>

<body>

<h1>🐱 Battle Cats Save Editor</h1>

<div class="box">

<h2>🥫 통조림 입력</h2>

<input id="cans" type="number" value="45000">

<br>

<button onclick="changeCans()">확인</button>

<h2 id="result">통조림: 45,000개</h2>

</div>


<script>

function changeCans(){

let value=document.getElementById("cans").value;

document.getElementById("result").innerHTML =
"통조림: " + Number(value).toLocaleString() + "개";

}

</script>


</body>
</html>
